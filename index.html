<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convite CAF - Confraternização 2025</title>
    <meta
      name="description"
      content="Intimação para Confraternização de Fim de Ano da Coordenadoria de Assuntos Fiscais - PGE/PR"
    />
    <meta name="author" content="CAF - PGE/PR" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="envelope-container" class="container">
      <div class="envelope-wrapper">
        <div class="envelope-body">
          <svg
            class="envelope-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="96"
            height="96"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="20" height="16" x="2" y="4" rx="2" />
            <path d="m2 7 8.97 5.7a1.94 1.94 0 0 0 2.06 0L22 7" />
          </svg>
        </div>

        <div id="envelope-flap" class="envelope-flap">
          <div class="seal">
            <span class="seal-text">CAF</span>
          </div>
        </div>

        <div class="protocol-stamp">
          <p class="protocol-title">Número do processo</p>
          <p class="protocol-number">0000XXX-XX.XXXX.8.16.XXXX</p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
